  - titel: "Eerste schilmiddag: 38 potten moes en 43 potjes jam"
    datum: 09-10-2026
    tekst: "Op donderdag 8 oktober hebben we samen appels geschild en gekookt in De Korenhof in Aalden. Het resultaat: 38 potten appelmoes en 43 potjes appeljam. Dank aan iedereen die erbij was — en aan De Korenhof en de bewoners voor de ruimte en de gastvrijheid. Fijn dat we daar steeds welkom zijn. De potjes worden op 16 en 17 oktober verkocht bij de PLUS in Aalden, het begin van de herfstvakantie regio Midden. Op donderdag 29 oktober is de volgende schilmiddag, ook om 13.30 uur in De Korenhof. Iedereen is welkom, ook als je er deze keer niet bij was."
    foto: /images/uploads/schilmiddag-2026.jpg
    foto_alt: Vrijwilligers aan het koken in de keuken van De Korenhof
  - titel: Plukdag een succes
    datum: 22-09-2026
    tekst: Op zaterdag 19 september ging Pluk & Deel weer appels plukken. Met een groep van twaalf vrijwilligers werd er bij elf tuinen in Zweeloo, Aalden en Benneveld geplukt. De opbrengst wisselde flink per boom. Bij sommige bomen vielen de appels er bijna vanzelf af — daar waren we precies op tijd om te plukken. Andere bomen hadden alleen hele kleine appeltjes; na het schillen en het verwijderen van het klokhuis zou daar weinig van overblijven, dus die hebben we laten hangen. Het was een gezellige ochtend die veel voldoening gaf. Dank aan alle plukkers en aan de tuineigenaren die hun appels beschikbaar stelden! De volgende stap is schillen en koken, op donderdag 8 oktober in De Korenhof in Aalden. Wil je daarbij helpen? Meld je aan via www.plukendeel.nl of stuur een mail naar info@plukendeel.nl. We zijn nog op zoek naar schone glazen potten met metalen deksel, zonder etiket. Je kunt ze neerzetten in de kast rechts naast de oprit van Klooster 2. Alvast veel dank.
    foto: /images/uploads/plukdag-2026.jpg
    foto_alt: Vrijwilligers aan het plukken in de boomgaard
  - titel: Goed doel voor 2026
    datum: 24-08-2026
    tekst: Dit jaar is het goede doel de kruisboogschietvereniging Willem Tell. Met nieuwe wedstrijd tenues kunnen de leden van Willem Tell herkenbaar en professioneel deelnemen aan wedstrijden. Het versterkt de uitstraling én het teamgevoel van de vereniging en draagt bij aan een gevoel van trots bij de leden. Actieve verenigingen zijn belangrijk voor de leefbaarheid van onze dorpen. Ze brengen mensen samen en zorgen voor ontmoeting en verbinding. Zo helpt een bijdrage van Pluk&Deel Willem Tell om als vereniging sterk en zichtbaar te blijven.
    foto: /images/uploads/willemtell.jpg
    foto_alt: Willem Tell in Aalden
  - titel: Plukdag op 19 september (reserve 26 september)
    datum: 14-08-2026
    tekst: De plukdag staat gepland op zaterdag 19 september 2026. De reservedag is zaterdag 26 september. Wil je meeplukken? Meld je aan via het formulier hieronder.
    foto: /images/uploads/plukken-unsplash.jpg
    foto_alt: Hand plukt een rode appel van de boom
  - titel: Een mooi appeljaar 2026
    datum: 25-06-2026
    tekst: We gaan weer van start met de voorbereidingen van Pluk & Deel in 2026. De bomen lijken veel appels te dragen, het team is enthousiast, dus we gaan er voor! We houden jullie via deze pagina op de hoogte.
    foto: /images/uploads/C09B98D7-8FED-4804-889F-B8F657718530-1.jpeg
    foto_alt: ''
  - titel: Opbrengst 2025 naar de Oranjevereniging
    datum: 12-05-2026
    tekst: "In 2025 brachten we 700 euro op voor de Oranjevereniging in Zweeloo. Dankzij deze bijdrage kunnen er de komende jaren weer activiteiten rond Koningsdag worden georganiseerd voor de kinderen in het dorp. De overhandiging kreeg een feestelijk tintje: het bedrag werd gepresenteerd op een grote, beschilderde appel. Bijzonder was ook de inzet van een flink aantal bewoners van het AZC, die enthousiast meehielpen. Ook Oes Eig'n Kraantien mocht een bijdrage ontvangen. Dit jaar nam Willy-Anne van Stiphout, een van de oprichters van Pluk en Deel, afscheid na jarenlange inzet. Zonder haar was dit initiatief nooit geworden wat het nu is."
    foto: /images/uploads/KoningsdagPlukDeel.jpg
    foto_alt: Overhandiging van de opbrengst aan de Oranjevereniging op Koningsdag
